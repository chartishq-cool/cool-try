name: Refresh stock lists

on:
  schedule:
    - cron: '0 20 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: argus-universe-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - id: refresh
        continue-on-error: true
        run: python backend/refresh_universe.py
      - name: Publish refreshed lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="$GITHUB_REF_NAME"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            git reset --mixed FETCH_HEAD
            shopt -s nullglob
            files=(backend/stock_lists/*_latest.json)
            if [ "${#files[@]}" = 0 ]; then exit 0; fi
            git add -f -- "${files[@]}"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh ARGUS exchange stock lists'
            if git push origin "HEAD:$branch"; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
      - name: Flag incomplete refresh
        if: steps.refresh.outcome == 'failure'
        run: exit 1
