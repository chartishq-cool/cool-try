name: Screener
run-name: ARGUS ${{ github.event.client_payload.jobId || github.run_id }}

on:
  repository_dispatch:
    types: [run-screener]
  schedule:
    - cron: '30 23 * * 0-4'   # 5:00 AM IST weekdays, both daily strategies
    - cron: '45 23 * * 0-4'   # 5:15 AM IST weekdays, both weekly strategies

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Run screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          SCAN_ID: ${{ github.event.client_payload.jobId || github.run_id }}
          MARKET: ${{ github.event.client_payload.market }}
          LOGIC: ${{ github.event.client_payload.logic }}
          TIMEFRAME: ${{ github.event.client_payload.timeframe }}
          PARAMS: ${{ github.event.client_payload.params }}
        run: |
          if [ "$EVENT" = schedule ]; then
            MARKET=NSE
            LOGIC=scheduled
            TIMEFRAME=daily
            if [ "$SCHEDULE" = '45 23 * * 0-4' ]; then TIMEFRAME=weekly; fi
            PARAMS='{}'
          fi
          python backend/screener_dispatcher.py --market "$MARKET" --logic "$LOGIC" \
            --timeframe "$TIMEFRAME" --params "$PARAMS" --job-id "$SCAN_ID"
      - name: Publish scan and dated CSVs
        env:
          SCAN_ID: ${{ github.event.client_payload.jobId || github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ]; then
            run_paths=("backend/results/runs/$SCAN_ID-breakout" "backend/results/runs/$SCAN_ID-pullback")
          else
            run_paths=("backend/results/runs/$SCAN_ID")
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="$GITHUB_REF_NAME"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            git reset --mixed FETCH_HEAD
            paths=("${run_paths[@]}")
            for dir in "${run_paths[@]}"; do
              for csv in "$dir"/*.csv; do
                archive="backend/results/$(basename "$csv")"
                cp "$csv" "$archive"
                paths+=("$archive")
              done
            done
            git add -f -- "${paths[@]}"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish ARGUS scan $SCAN_ID"
            if git push origin "HEAD:$branch"; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
